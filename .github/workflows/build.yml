name: Desktop and shared API
on: [push, pull_request]
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15-intel, macos-14, windows-latest, ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            apps/desktop/src-tauri -> target
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - if: startsWith(matrix.os, 'ubuntu')
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev libdbus-1-dev dbus-x11 gnome-keyring
      - name: Cache native HEIC decoder
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/wardrobe-media
          key: media-libheif-1.23.1-libde265-1.1.3-${{ matrix.os }}-v1
      - name: Build native HEIC decoder (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          bash scripts/bootstrap-media-unix.sh "$RUNNER_TEMP/wardrobe-media"
          echo "PKG_CONFIG_PATH=$RUNNER_TEMP/wardrobe-media/install/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$RUNNER_TEMP/wardrobe-media/install/lib" >> "$GITHUB_ENV"
          echo "DYLD_LIBRARY_PATH=$RUNNER_TEMP/wardrobe-media/install/lib" >> "$GITHUB_ENV"
      - name: Build native HEIC decoder (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/bootstrap-media-windows.ps1 -MediaRoot "$env:RUNNER_TEMP/wardrobe-media"
      - run: cargo test --workspace
      - name: Verify native credential store (macOS and Windows)
        if: runner.os != 'Linux'
        run: cargo test -p wardrobe-core --test providers credentials_can_be_set_replaced_and_removed_without_echo_or_database_persistence -- --ignored
      - name: Verify Secret Service credential store (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          dbus-run-session -- bash -c 'printf "%s" "disposable-ci-keyring" | gnome-keyring-daemon --unlock --components=secrets >/dev/null; cargo test -p wardrobe-core --test providers credentials_can_be_set_replaced_and_removed_without_echo_or_database_persistence -- --ignored'
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: npm ci
        working-directory: apps/desktop
      - run: npm run build
        working-directory: apps/desktop
      - run: npm run tauri build -- --no-bundle
        working-directory: apps/desktop
